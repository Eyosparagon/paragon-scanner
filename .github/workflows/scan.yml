name: Scan for setups

on:
  schedule:
    - cron: "*/15 * * * *"     # a safety net only: restarts the watch if it ever stops
  workflow_dispatch:            # lets you press "Run workflow" to try it by hand
    inputs:
      test:
        description: "Send one test alert with its chart"
        type: boolean
        default: false

permissions:
  contents: write               # lets the run save chart pictures into the charts folder
  actions: write                # lets the run start the next one when it ends

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      # remembers which alerts were already sent, so each one reaches you once
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      # watches for about five and a half hours, scanning every 90 seconds
      - run: python scanner.py --loop 330 ${{ inputs.test && '--test' || '' }}
        env:
          # the secret was saved under the name OANDO_TOKEN, so either spelling is accepted
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN || secrets.OANDO_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          WHATABOT_KEY: ${{ secrets.WHATABOT_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      - name: Save chart pictures
        if: always()
        run: |
          git config user.name "paragon-scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add -A charts 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Chart pictures" && git push -q)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
      # GitHub's own timer proved unreliable, so each watch starts the next one as it ends
      - name: Start the next watch
        if: success() || failure()
        run: gh workflow run scan.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
